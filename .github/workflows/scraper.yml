name: Automated EV Scanner

on:
  workflow_dispatch: # Keeps your manual "Run workflow" button active
  schedule:
    # MAX GITHUB ACTIONS FREQUENCY (Every 5 minutes, 24/7)
    - cron: '*/5 * * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests gspread

      - name: Run Scraper
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python main.py
