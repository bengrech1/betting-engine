name: Betting Engine Auto-Scanner

on:
  schedule:
    # NBA Morning Rush: Runs every 20 mins from 7am to 11am AEDT (20:00 to 23:59 UTC)
    - cron: '*/20 20-23 * * *'
    
    # AFL/NRL Afternoon Drop: Runs every 20 mins from 3pm to 7pm AEDT (04:00 to 07:59 UTC)
    - cron: '*/20 4-7 * * *'
  workflow_dispatch:

jobs:
  scan-odds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests gspread

      - name: Run Betting Engine
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python main.py
