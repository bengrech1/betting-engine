name: Automated EV Scanner

on:
  workflow_dispatch: # Keeps your manual "Run workflow" button active
  schedule:
    # 1. The NBA Morning Rush (Every Day)
    # Runs every 5 minutes from 8:00 AM to 11:00 AM AEDT 
    - cron: '*/5 21-23 * * *'

    # 2. The Aussie Evening Primer (Wednesday, Thursday, Friday)
    # Runs every 15 minutes from 5:00 PM to 9:00 PM AEDT
    - cron: '*/15 6-10 * * 3-5'

    # 3. The Weekend Warzone (Saturday, Sunday)
    # Runs every 10 minutes from 1:00 PM to 9:00 PM AEDT
    - cron: '*/10 2-10 * * 6,0'
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests gspread

      - name: Run Scraper
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python main.py
